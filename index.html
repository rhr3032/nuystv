<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>NUYsTV</title>
	<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main class="app-shell">
		<header class="topbar">
			<div>
				<p class="eyebrow">NUYsTV</p>
				<h1>Live TV</h1>
				<p class="subtitle">Enjoy live television from around the world.</p>
			</div>
			<div class="topbar-actions">
				<button class="ghost-btn" type="button" onclick="toggleTheme()">Theme</button>
				<button class="ghost-btn" type="button" onclick="openAllChannels()">View All Channels</button>
				<input id="searchInput" class="search-input" type="search" placeholder="Search channels or groups" oninput="handleSearch()">
			</div>
		</header>

		<section class="hero-card">
			<div class="hero-video-shell">
				<video id="video" autoplay playsinline controls muted></video>
				<div class="hero-gradient"></div>
				<div class="hero-copy">
					<div class="status-chip" id="sourceChip">Featured</div>
					<h2 id="heroTitle">Select a channel</h2>
					<p id="heroMeta">Choose a channel from either row below to load the stream in the preview.</p>
				</div>
			</div>
			<div class="hero-actions">
				<button class="primary-btn" type="button" onclick="prevChannel()">Previous</button>
				<button class="primary-btn" type="button" onclick="togglePlay()">Play / Pause</button>
				<button class="primary-btn" type="button" onclick="nextChannel()">Next</button>
			</div>
		</section>

		<section id="collections"></section>
	</main>

	<div id="allChannelsModal" class="all-channels-modal" hidden>
		<div class="all-channels-backdrop" onclick="closeAllChannels()"></div>
		<div class="all-channels-panel" role="dialog" aria-modal="true" aria-labelledby="allChannelsTitle">
			<div class="all-channels-header">
				<div>
					<p class="eyebrow">Library</p>
					<h2 id="allChannelsTitle">All Channels</h2>
				</div>
				<button class="rail-btn" type="button" onclick="closeAllChannels()">×</button>
			</div>
			<div id="allChannelsList" class="all-channels-list"></div>
		</div>
	</div>

	<script src="app.js"></script>
</body>
</html>
